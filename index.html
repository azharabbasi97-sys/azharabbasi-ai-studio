<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar Abbasi | Humanized AI Studio Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --main: #6c5ce7; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: var(--text); }
        .container { background: #fff; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 750px; }
        
        /* Premium Header */
        .profile-box { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; }
        .user-photo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--main); object-fit: cover; }
        .info h2 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
        .info p { margin: 3px 0; color: #64748b; font-weight: 500; }
        .badge { background: #dcfce7; color: #15803d; padding: 5px 12px; border-radius: 50px; font-size: 12px; font-weight: 700; display: inline-block; margin-top: 8px; }

        /* Human-Like Interaction Area */
        textarea { width: 100%; height: 140px; padding: 20px; border-radius: 18px; border: 2px solid #e2e8f0; font-size: 17px; box-sizing: border-box; outline: none; transition: 0.3s; line-height: 1.5; }
        textarea:focus { border-color: var(--main); background: #fdfdff; }

        /* Pro Buttons Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin: 25px 0; }
        button { padding: 14px; border: none; border-radius: 14px; cursor: pointer; color: white; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        button:hover { transform: scale(1.03); filter: brightness(1.1); }
        
        .mic { background: #334155; } .ask { background: var(--main); } .img { background: #f43f5e; } .voice { background: #f59e0b; } .pdf { background: #10b981; }

        /* Clean Output Area */
        .output-container { margin-top: 25px; text-align: left; }
        .status { font-size: 13px; font-weight: bold; color: var(--main); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        #output { padding: 25px; background: #f1f5f9; border-radius: 20px; min-height: 80px; font-size: 16px; line-height: 1.8; color: #334155; border: 1px solid #e2e8f0; }
        img { width: 100%; border-radius: 18px; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-box">
        <img src="profile.jpg" class="user-photo" alt="Azhar" onerror="this.src='https://via.placeholder.com/90'">
        <div class="info">
            <h2>Azhar Abbasi</h2>
            <p>AI Developer | Multi-Language Expert</p>
            <span class="badge">✓ VERIFIED PRO SYSTEM</span>
        </div>
    </div>

    <textarea id="userInput" placeholder="Ask in any language (Urdu, English, Hindi, etc)..."></textarea>
    
    <div class="grid">
        <button class="mic" onclick="startMic()">🎤 Voice Input</button>
        <button class="ask" onclick="askAI()">🚀 Execute Task</button>
        <button class="img" onclick="createImage()">🎨 Create Image</button>
        <button class="voice" onclick="readOut()">🔊 Listen Answer</button>
        <button class="pdf" onclick="exportPDF()">📄 Save Report</button>
    </div>

    <div class="output-container">
        <div class="status">Live Studio Response</div>
        <div id="output">System Ready. I can Understand, Read, and Speak all languages.</div>
    </div>
</div>

<script>
    // 1. Smart Multi-language Chat (Humanized)
    async function askAI() {
        const input = document.getElementById('userInput').value;
        const out = document.getElementById('output');
        if(!input) return;
        
        out.innerHTML = "<i>AI is processing your request...</i>";
        try {
            const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(input)}?model=openai&system=Act as a highly intelligent human assistant. Avoid using unnecessary dashes or formal coding symbols. Answer naturally in the same language as the user.`);
            let data = await res.text();
            // Removing unnecessary symbols
            out.innerText = data.replace(/[\\*_#-]/g, '').trim();
        } catch(e) { out.innerText = "Connection lost. Please try again."; }
    }

    // 2. Pro Image Creation
    function createImage() {
        const input = document.getElementById('userInput').value;
        const out = document.getElementById('output');
        if(!input) return;
        out.innerHTML = "<i>Crafting your vision...</i>";
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(input)}?width=1080&height=1080&nologo=true&enhance=true`;
        out.innerHTML = `<img src="${url}" alt="AI Masterpiece">`;
    }

    // 3. Multi-language Mic (Auto Detect)
    function startMic() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.continuous = false;
        rec.onstart = () => { document.getElementById('userInput').placeholder = "Listening now..."; };
        rec.onresult = (e) => {
            document.getElementById('userInput').value = e.results[0][0].transcript;
            askAI(); // Automatically ask after speaking
        };
        rec.start();
    }

    // 4. Natural Voice (Reading Ability)
    function readOut() {
        const txt = document.getElementById('output').innerText;
        const speech = new SpeechSynthesisUtterance(txt);
        // Smart language detection for voice
        speech.rate = 0.9; 
        window.speechSynthesis.speak(speech);
    }

    // 5. Professional PDF Export
    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFont("helvetica", "bold");
        doc.text("AZHAR ABBASI AI STUDIO PRO REPORT", 15, 20);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        const splitText = doc.splitTextToSize(document.getElementById('output').innerText, 180);
        doc.text(splitText, 15, 35);
        doc.save("Azhar_Pro_Report.pdf");
    }
</script>

</body>
</html>
