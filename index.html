<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar Abbasi | AI Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eaeff2; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: #ffffff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 550px; }
        
        /* Header Interface */
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-align: left; }
        .user-photo { width: 75px; height: 75px; border-radius: 50%; border: 2px solid #2d3436; object-fit: cover; }
        .info h2 { margin: 0; font-size: 22px; color: #333; }
        .info p { margin: 2px 0; color: #666; font-size: 14px; }
        .verified { color: #0984e3; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 4px; }

        textarea { width: 100%; height: 110px; padding: 15px; border-radius: 10px; border: 1px solid #dfe6e9; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; background: #fbfbfb; resize: none; }
        
        /* Buttons Interface */
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; }
        button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: 500; font-size: 14px; transition: 0.2s; }
        .btn-mic { background: #2d3436; } 
        .btn-ask { background: #6c5ce7; } 
        .btn-img { background: #d63031; } 
        .btn-listen { background: #e67e22; } 
        .btn-pdf { background: #27ae60; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Output Section */
        .output-label { text-align: left; font-weight: bold; color: #2d3436; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        #output { padding: 18px; background: #f8f9fa; border-radius: 10px; text-align: left; border-left: 4px solid #6c5ce7; min-height: 60px; color: #444; line-height: 1.6; }
        img.gen-img { max-width: 100%; border-radius: 10px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-header">
        <img src="profile.jpg" class="user-photo" alt="Azhar" onerror="this.src='https://via.placeholder.com/75'">
        <div class="info">
            <h2>Azhar Abbasi</h2>
            <p>AI Developer | Tech Enthusiast</p>
            <div class="verified"><span>Verified AI Creator</span></div>
        </div>
    </div>

    <textarea id="userInput" placeholder="Ask anything or describe an image..."></textarea>
    
    <div class="btn-group">
        <button class="btn-mic" onclick="startMic()">🎤 Mic</button>
        <button class="btn-ask" onclick="askAI()">Ask AI</button>
        <button class="btn-img" onclick="createImage()">Create Image</button>
        <button class="btn-listen" onclick="speak()">Listen</button>
        <button class="btn-pdf" onclick="savePDF()">PDF</button>
    </div>

    <div class="output-label">🤖 Studio Output</div>
    <div id="output">Jawab yahan dikhega...</div>
</div>

<script>
    // Functions
    async function askAI() {
        const p = document.getElementById('userInput').value;
        const o = document.getElementById('output');
        if(!p) return;
        o.innerText = "Processing...";
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(p)}`);
        o.innerText = await res.text();
    }

    function createImage() {
        const p = document.getElementById('userInput').value;
        const o = document.getElementById('output');
        if(!p) return;
        o.innerHTML = "Generating Image...";
        o.innerHTML = `<img src="https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?nologo=true" class="gen-img">`;
    }

    function startMic() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; };
        rec.start();
    }

    function speak() {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('output').innerText));
    }

    function savePDF() {
        const doc = new jspdf.jsPDF();
        doc.text(document.getElementById('output').innerText, 10, 10, {maxWidth: 180});
        doc.save("Azhar-AI-Output.pdf");
    }
</script>
</body>
</html>
