<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar Abbasi | AI Studio Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --secondary: #00cec9; --accent: #ff7675; --dark: #2d3436; }
        body { font-family: 'Poppins', sans-serif; background: #f4f7fb; margin: 0; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
        
        /* Profile Header */
        .profile-card { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; background: linear-gradient(to right, #ffffff, #f9f9ff); padding: 15px; border-radius: 15px; border: 1px solid #eee; }
        .user-photo { width: 85px; height: 85px; border-radius: 50%; border: 4px solid var(--primary); object-fit: cover; box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3); }
        .profile-info h2 { margin: 0; color: var(--dark); font-size: 24px; }
        .badge { background: #e1f5fe; color: #039be5; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 5px; display: inline-block; }

        /* Input Section */
        textarea { width: 100%; height: 120px; padding: 15px; border-radius: 15px; border: 2px solid #edf2f7; font-size: 16px; transition: 0.3s; box-sizing: border-box; outline: none; }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(108, 92, 231, 0.1); }

        /* Modern Buttons Grid */
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 20px 0; }
        button { padding: 12px; border: none; border-radius: 12px; cursor: pointer; color: white; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s ease; font-size: 14px; }
        button:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); opacity: 0.9; }
        
        .btn-mic { background: #4b6584; }
        .btn-ask { background: var(--primary); }
        .btn-img { background: var(--accent); }
        .btn-listen { background: #f39c12; }
        .btn-pdf { background: #27ae60; }

        /* Output Area */
        .output-box { margin-top: 25px; padding: 25px; background: #ffffff; border-radius: 18px; border: 1px solid #e0e0e0; min-height: 100px; text-align: left; position: relative; }
        .output-box::before { content: "Studio Output"; position: absolute; top: -12px; left: 20px; background: var(--primary); color: white; padding: 2px 12px; border-radius: 10px; font-size: 12px; }
        #output-text { color: #2d3436; line-height: 1.7; white-space: pre-wrap; }
        .gen-image { max-width: 100%; border-radius: 15px; margin-top: 15px; border: 5px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* Dark Mode Toggle */
        .mode-toggle { float: right; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <img src="profile.jpg" class="user-photo" alt="Azhar" onerror="this.src='https://via.placeholder.com/85'">
        <div class="profile-info">
            <h2>Azhar Abbasi</h2>
            <span class="badge">● Verified AI Studio Pro</span>
        </div>
    </div>

    <textarea id="userInput" placeholder="Kuch bhi likhein ya Mic ka istemal karein..."></textarea>
    
    <div class="btn-grid">
        <button class="btn-mic" onclick="startMic()">🎤 Mic</button>
        <button class="btn-ask" onclick="askAI()">🚀 Ask AI</button>
        <button class="btn-img" onclick="createImage()">🎨 Image</button>
        <button class="btn-listen" onclick="speak()">🔊 Listen</button>
        <button class="btn-pdf" onclick="downloadPDF()">📄 PDF</button>
    </div>

    <div class="output-box">
        <div id="output-text">Taiyar hain! Kuch sawal poochein...</div>
    </div>
</div>

<script>
    // 1. Text AI (Pollinations)
    async function askAI() {
        const input = document.getElementById('userInput').value;
        const out = document.getElementById('output-text');
        if(!input) return alert("Pehle kuch likhen!");
        
        out.innerHTML = "<i>AI Soch raha hai...</i>";
        try {
            const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(input)}`);
            const data = await res.text();
            out.innerText = data;
        } catch(e) { out.innerText = "Error: Connection ka masla."; }
    }

    // 2. Image Generation
    function createImage() {
        const input = document.getElementById('userInput').value;
        const out = document.getElementById('output-text');
        if(!input) return alert("Image ka topic likhen!");

        out.innerHTML = "<i>Image design ho rahi hai...</i>";
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(input)}?width=1024&height=1024&nologo=true`;
        out.innerHTML = `<img src="${url}" class="gen-image" alt="AI Generated">`;
    }

    // 3. Voice to Text (Mic)
    function startMic() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.onstart = () => { document.getElementById('userInput').placeholder = "Bolte rahein..."; };
        recognition.onresult = (e) => {
            document.getElementById('userInput').value = e.results[0][0].transcript;
        };
        recognition.start();
    }

    // 4. Text to Speech (Listen)
    function speak() {
        const txt = document.getElementById('output-text').innerText;
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(txt));
    }

    // 5. PDF Export
    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const content = document.getElementById('output-text').innerText;
        doc.setFontSize(18);
        doc.text("Azhar Abbasi AI Studio Report", 10, 10);
        doc.setFontSize(12);
        doc.text(content, 10, 25, { maxWidth: 180 });
        doc.save("Azhar_AI_Report.pdf");
    }
</script>

</body>
</html>
