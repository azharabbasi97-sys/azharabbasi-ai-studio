<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar Abbasi AI Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --primary: #4361ee; --secondary: #8e44ad; --bg: #f8fafc; --card: white; --text: #1e293b; }
        body.dark-mode { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; transition: 0.3s; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.05); }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .user-photo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #eee; }
        .user-info h1 { margin: 0; font-size: 26px; color: var(--primary); }
        .user-info p { margin: 5px 0 0; opacity: 0.7; font-size: 14px; }
        textarea { width: 100%; height: 100px; padding: 15px; border-radius: 12px; border: 1px solid #ddd; background: rgba(0,0,0,0.01); color: var(--text); font-size: 16px; box-sizing: border-box; outline: none; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        button { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; font-size: 13px; color: white; }
        .btn-ai { background: var(--secondary); }
        .btn-img { background: #ff4757; }
        .btn-mic { background: #475569; }
        .btn-speak { background: #f59e0b; }
        .btn-pdf { background: #10b981; }
        .output-window { border-left: 5px solid var(--primary); padding: 20px; background: rgba(0,0,0,0.02); border-radius: 12px; min-height: 60px; }
        #generatedImage { width: 100%; border-radius: 12px; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="profile-header">
            <img src="profile.jpg" class="user-photo" alt="Azhar Abbasi" onerror="this.src='https://via.placeholder.com/100'">
            <div class="user-info">
                <h1>Azhar Abbasi</h1>
                <p>AI Developer | Tech Enthusiast</p>
                <div style="margin-top: 8px;"><i class="fas fa-certificate" style="color: #3b82f6;"></i> Verified AI Creator</div>
            </div>
            <button style="margin-left: auto; background: #64748b;" onclick="document.body.classList.toggle('dark-mode')"><i class="fas fa-adjust"></i></button>
        </div>

        <textarea id="userInput" placeholder="Kuch bhi likhein..."></textarea>
        
        <div class="btn-group">
            <button class="btn-mic" onclick="startDictation()"><i class="fas fa-microphone"></i> Mic</button>
            <button class="btn-ai" onclick="askGemini()">Ask AI</button>
            <button class="btn-img" onclick="generateImage()">Create Image</button>
            <button class="btn-speak" onclick="speakText()"><i class="fas fa-volume-up"></i> Listen</button>
            <button class="btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
        </div>
    </div>

    <div class="card" id="reportArea">
        <h3 style="margin-top:0;"><i class="fas fa-robot"></i> Studio Output</h3>
        <div id="aiResponse" class="output-window">Jawab yahan dikhega...</div>
        <img id="generatedImage">
    </div>
</div>

<script>
    const GEMINI_API_KEY = "AIzaSyDgZmviVIFbOZ7RbTMF9m7Io1dKPblUzvg";

    async function askGemini() {
        const text = document.getElementById('userInput').value;
        if (!text) return alert("Kuch likhein!");
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });
            const data = await response.json();
            document.getElementById('aiResponse').innerText = data.candidates[0].content.parts[0].text;
        } catch (e) { alert("Error!"); }
    }

    function generateImage() {
        const text = document.getElementById('userInput').value;
        if (!text) return alert("Description likhein!");
        const img = document.getElementById('generatedImage');
        img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=800&height=500&nologo=true`;
        img.style.display = "block";
    }

    function startDictation() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; };
        recognition.start();
    }

    function speakText() {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('aiResponse').innerText));
    }

    function downloadPDF() {
        html2pdf().from(document.getElementById('reportArea')).save('Azhar_AI_Report.pdf');
    }
</script>
</body>
</html>
