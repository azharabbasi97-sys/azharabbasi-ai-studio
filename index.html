<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar Abbasi AI Studio</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        .profile { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; text-align: left; }
        .user-photo { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #6c5ce7; object-fit: cover; }
        textarea { width: 100%; height: 120px; padding: 15px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; }
        .buttons { display: flex; gap: 10px; justify-content: center; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; }
        .btn-chat { background: #6c5ce7; }
        .btn-img { background: #00cec9; }
        button:hover { opacity: 0.8; }
        #output { margin-top: 25px; padding: 20px; background: #f9f9f9; border-radius: 12px; text-align: left; border-left: 6px solid #6c5ce7; min-height: 50px; line-height: 1.6; }
        img { max-width: 100%; border-radius: 12px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="profile">
        <img src="profile.jpg" class="user-photo" alt="Azhar Abbasi" onerror="this.src='https://via.placeholder.com/70'">
        <div>
            <h2 style="margin:0;">Azhar Abbasi</h2>
            <p style="margin:0; color:gray; font-size:14px;">AI Studio Developer</p>
        </div>
    </div>

    <textarea id="userInput" placeholder="Kuch bhi poochein ya image prompt likhein..."></textarea>
    
    <div class="buttons">
        <button class="btn-chat" onclick="runChat()">Ask AI</button>
        <button class="btn-img" onclick="runImage()">Create Image</button>
    </div>

    <div id="output">Jawab yahan aayega...</div>
</div>

<script>
    async function runChat() {
        const prompt = document.getElementById('userInput').value;
        const output = document.getElementById('output');
        if (!prompt) return alert("Kuch likhein!");

        output.innerHTML = "AI Soch raha hai...";
        
        try {
            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
            const text = await response.text();
            output.innerText = text;
        } catch (err) {
            output.innerText = "Connection error! Dobara koshish karein.";
        }
    }

    function runImage() {
        const prompt = document.getElementById('userInput').value;
        const output = document.getElementById('output');
        if (!prompt) return alert("Image ke liye kuch likhein!");

        output.innerHTML = "Image ban rahi hai...";
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true`;
        output.innerHTML = `<img src="${imgUrl}" alt="AI Image">`;
    }
</script>

</body>
</html>
