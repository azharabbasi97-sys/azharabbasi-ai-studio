<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate AI Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --primary: #4361ee; --secondary: #8e44ad; --bg: #f5f7fa; --card: white; --text: #212529; }
        body.dark-mode { --bg: #1a202c; --card: #2d3748; --text: #e2e8f0; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; padding: 20px; transition: 0.3s; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 15px; border-radius: 10px; border: 1px solid #ddd; background: transparent; color: var(--text); font-size: 16px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        button { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.2s; font-size: 13px; color: white; }
        .btn-ai { background: var(--secondary); }
        .btn-img { background: #ff4757; }
        .btn-mic { background: #2f3542; }
        .btn-speak { background: #f39c12; }
        .btn-pdf { background: #27ae60; }
        .result-box { border-left: 4px solid var(--primary); padding: 15px; margin-top: 15px; background: rgba(0,0,0,0.02); border-radius: 8px; }
        #generatedImage { width: 100%; border-radius: 10px; margin-top: 15px; display: none; }
        .loader { display: none; width: 18px; height: 18px; border: 3px solid #f3f3f3; border-top: 3px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2><i class="fas fa-bolt"></i> Ultimate AI Studio</h2>
        <textarea id="userInput" placeholder="Kuch likhein (e.g. 'A cat in space' tasveer k liye ya koi sawal)..."></textarea>
        <div class="btn-group">
            <button class="btn-mic" onclick="startDictation()"><i class="fas fa-microphone"></i> Mic</button>
            <button class="btn-ai" onclick="askGemini()">Ask AI <div class="loader" id="aiLoader"></div></button>
            <button class="btn-img" onclick="generateImage()">Create Image <div class="loader" id="imgLoader"></div></button>
            <button class="btn-speak" onclick="speakText()"><i class="fas fa-volume-up"></i> Listen</button>
            <button class="btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Save PDF</button>
            <button style="background:#555" onclick="document.body.classList.toggle('dark-mode')">Mode</button>
        </div>
    </div>

    <div class="card" id="reportArea">
        <h3>Output Window</h3>
        <div id="aiResponse" class="result-box">Jawab yahan dikhega...</div>
        <img id="generatedImage" alt="AI Generated Image">
    </div>
</div>

<script>
    const GEMINI_API_KEY = "AIzaSyDgZmviVIFbOZ7RbTMF9m7Io1dKPblUzvg";

    // 1. Text AI (Gemini)
    async function askGemini() {
        const text = document.getElementById('userInput').value;
        if (!text) return alert("Kuch likhein!");
        const loader = document.getElementById('aiLoader');
        loader.style.display = "inline-block";
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });
            const data = await response.json();
            document.getElementById('aiResponse').innerText = data.candidates[0].content.parts[0].text;
        } catch (e) { alert("Error!"); }
        loader.style.display = "none";
    }

    // 2. Image Generation (Free Tool)
    function generateImage() {
        const text = document.getElementById('userInput').value;
        if (!text) return alert("Image description likhein!");
        const img = document.getElementById('generatedImage');
        const loader = document.getElementById('imgLoader');
        
        loader.style.display = "inline-block";
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=800&height=600&nologo=true`;
        
        img.src = imageUrl;
        img.style.display = "block";
        img.onload = () => { loader.style.display = "none"; };
    }

    // 3. Voice typing
    function startDictation() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; };
        recognition.start();
    }

    // 4. Voice listening
    function speakText() {
        const text = document.getElementById('aiResponse').innerText;
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }

    // 5. PDF
    function downloadPDF() {
        html2pdf().from(document.getElementById('reportArea')).save('AI_Studio_Export.pdf');
    }
</script>
</body>
</html>
