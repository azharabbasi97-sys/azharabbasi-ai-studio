<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar AI | ChatGPT Urdu Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #212121; color: #ececec; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3d3d3d; }
        .profile { display: flex; align-items: center; gap: 10px; }
        .user-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1.5px solid #19c37d; }
        .badge { background: #19c37d; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        #chat-area { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 25px; scroll-behavior: smooth; }
        .message { max-width: 100%; line-height: 1.8; font-size: 17px; white-space: pre-wrap; transition: 0.3s; }
        .user-msg { font-weight: 600; color: #fff; text-align: right; background: #2f2f2f; padding: 10px 15px; border-radius: 15px; align-self: flex-end; }
        .ai-msg { color: #d1d1d1; padding: 5px 15px; border-left: 3px solid #19c37d; align-self: flex-start; }
        .input-container { padding: 20px 15%; background: #212121; }
        .input-wrapper { background: #2f2f2f; border-radius: 30px; display: flex; align-items: center; padding: 12px 20px; border: 1px solid #4d4d4d; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .plus-btn { background: none; border: none; color: #b4b4b4; font-size: 26px; cursor: pointer; padding-right: 15px; }
        textarea { flex: 1; background: none; border: none; color: white; outline: none; font-size: 16px; resize: none; max-height: 150px; font-family: inherit; }
        .action-btns { display: flex; gap: 15px; align-items: center; }
        .mic-btn { background: none; border: none; color: #b4b4b4; font-size: 22px; cursor: pointer; }
        .send-btn { background: #ececec; color: #000; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .top-tools { display: flex; gap: 10px; }
        .tool-btn { background: #3d3d3d; color: #ccc; border: none; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { background: #4d4d4d; color: #fff; }
        img.gen-img { width: 100%; max-width: 500px; border-radius: 15px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="header">
    <div class="profile">
        <img src="profile.jpg" class="user-photo" alt="Azhar" onerror="this.src='https://via.placeholder.com/40'">
        <div>
            <div style="font-weight: bold;">Azhar Abbasi <span class="badge">PRO</span></div>
            <div style="font-size: 11px; color: #8e8e8e;">Verified AI Studio</div>
        </div>
    </div>
    <div class="top-tools">
        <button class="tool-btn" onclick="speakText()">🔊 Listen</button>
        <button class="tool-btn" onclick="savePDF()">📄 PDF Report</button>
    </div>
</div>

<div id="chat-area">
    <div class="message ai-msg">Assalam-o-Alaikum! Main aapki kaise madad kar sakta hoon?</div>
</div>

<div class="input-container">
    <div class="input-wrapper">
        <button class="plus-btn" title="Create Image" onclick="createImage()">+</button>
        <textarea id="userInput" rows="1" placeholder="Type in Urdu or any language..." oninput="autoResize(this)"></textarea>
        <div class="action-btns">
            <button class="mic-btn" onclick="startMic()">🎤</button>
            <button class="send-btn" onclick="askAI()">↑</button>
        </div>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chat-area');
    const input = document.getElementById('userInput');

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    async function askAI() {
        const text = input.value.trim();
        if(!text) return;

        chatArea.innerHTML += `<div class="message user-msg">${text}</div>`;
        input.value = '';
        input.style.height = 'auto';
        
        const responseDiv = document.createElement('div');
        responseDiv.className = 'message ai-msg';
        responseDiv.innerText = 'AI Soch raha hai...';
        chatArea.appendChild(responseDiv);
        chatArea.scrollTop = chatArea.scrollHeight;

        try {
            // System prompt added to prioritize Urdu over Hindi
            const systemPrompt = "Respond in Urdu. Avoid Hindi script or heavy Hindi vocabulary unless the user explicitly asks for Hindi. Keep it human-like and natural.";
            const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?system=${encodeURIComponent(systemPrompt)}`);
            const data = await res.text();
            responseDiv.innerText = data.replace(/[\\*_#-]/g, '').trim();
        } catch (e) { responseDiv.innerText = "Connection Error! Dobara koshish karein."; }
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function createImage() {
        const text = input.value.trim();
        if(!text) return alert("Pehle image ka description likhein!");
        chatArea.innerHTML += `<div class="message user-msg">Generating: ${text}</div>`;
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?nologo=true&enhance=true`;
        chatArea.innerHTML += `<div class="message ai-msg"><img src="${url}" class="gen-img"></div>`;
        input.value = '';
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function startMic() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'ur-PK'; // Urdu recognition priority
        rec.onresult = (e) => { input.value = e.results[0][0].transcript; askAI(); };
        rec.start();
    }

    function speakText() {
        const msgs = document.querySelectorAll('.ai-msg');
        const lastMsg = msgs[msgs.length - 1].innerText;
        const utterance = new SpeechSynthesisUtterance(lastMsg);
        utterance.lang = 'ur-PK'; 
        window.speechSynthesis.speak(utterance);
    }

    function savePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text(chatArea.innerText, 10, 10, {maxWidth: 180});
        doc.save("Azhar-AI-Chat.pdf");
    }
</script>
</body>
</html>
