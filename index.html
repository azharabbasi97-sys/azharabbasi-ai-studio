<div class="input-bar">
    <input type="file" id="fileInput" style="display:none" onchange="handleUpload(this)">
    
    <button class="plus-btn" onclick="document.getElementById('fileInput').click()" title="Upload File">
        <i class="fas fa-plus-circle"></i>
    </button>
    
    <textarea id="userInput" rows="1" placeholder="Ask anything or upload..."></textarea>
    
    <div class="right-icons">
        <button class="mic-btn" onclick="startMic()"><i class="fas fa-microphone"></i></button>
        <button class="send-btn" onclick="askAI()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    // File Handle Function
    function handleUpload(input) {
        const file = input.files[0];
        if (file) {
            const chatArea = document.getElementById('chat-area');
            const reader = new FileReader();
            
            reader.onload = function(e) {
                if (file.type.startsWith('image/')) {
                    chatArea.innerHTML += `<div class="message user-msg">
                        <img src="${e.target.result}" style="max-width:200px; border-radius:10px;"><br>
                        Sent Photo: ${file.name}</div>`;
                } else {
                    chatArea.innerHTML += `<div class="message user-msg">📄 File: ${file.name}</div>`;
                }
                chatArea.scrollTop = chatArea.scrollHeight;
            };
            reader.readAsDataURL(file);
            
            // Note: Currently Pollinations AI only reads text. 
            // For full Vision/OCR, we need a different API.
        }
    }
    
    // Baki Saara Code (Sidebar, AskAI, Language Fix) Wahi Rahega
</script>
