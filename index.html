<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro ID Photo Studio</title>
<style>
  :root {
    --primary: #4f46e5;
    --dark: #1e293b;
    --light: #f1f5f9;
    --border: #cbd5e1;
  }
  body { font-family: sans-serif; background: var(--light); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
  
  /* Layout */
  .container { display: flex; gap: 20px; max-width: 1200px; width: 100%; flex-wrap: wrap; justify-content: center; }
  .sidebar { flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; height: fit-content; }
  
  /* Canvas Area */
  .main-area { flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 350px; }
  .canvas-wrapper { position: relative; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: 2px solid white; overflow: hidden; background-image: conic-gradient(#eee 90deg, transparent 90deg), conic-gradient(transparent 90deg, #eee 90deg); background-size: 20px 20px; }
  
  /* Controls */
  h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: var(--dark); border-bottom: 2px solid var(--light); padding-bottom: 5px; }
  label { font-size: 0.9rem; font-weight: 600; color: #64748b; display: block; margin-bottom: 5px; }
  
  .control-group { background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
  
  input[type="range"] { width: 100%; margin-bottom: 10px; }
  select, input[type="file"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 10px; }
  
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; background: var(--light); color: var(--dark); }
  button:hover { background: #e2e8f0; }
  button.active { background: var(--primary); color: white; }
  .btn-primary { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
  .btn-primary:hover { background: #4338ca; }

  /* Overlay Objects (Suits) */
  .overlay-obj { position: absolute; cursor: grab; border: 1px dashed transparent; }
  .overlay-obj:hover, .overlay-obj.selected { border: 1px dashed #3b82f6; }
  
  /* Asset Gallery */
  .asset-list { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; }
  .asset-item { width: 50px; height: 50px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; object-fit: contain; background: white; }
  .asset-item:hover { border-color: var(--primary); }

  /* Crop Overlay */
  #cropOverlay { position: absolute; top: 0; left: 0; pointer-events: none; border: 2px solid red; box-shadow: 0 0 0 9999px rgba(0,0,0,0.7); display: none; }
</style>
</head>
<body>

<h1>Professional ID Studio</h1>

<div class="container">
  <div class="sidebar">
    
    <div class="control-group">
      <h2>1. Source</h2>
      <input type="file" id="uploadInput" accept="image/*">
      <div class="btn-grid">
        <button id="rotateLeftBtn">↺ -90°</button>
        <button id="rotateRightBtn">↻ +90°</button>
      </div>
    </div>

    <div class="control-group">
      <h2>2. Size & Crop</h2>
      <select id="sizeSelect">
        <option value="35,45">Passport (35x45mm)</option>
        <option value="51,51">US Visa (2x2 inch)</option>
        <option value="30,40">CNIC/Card (30x40mm)</option>
      </select>
      <label>Zoom Image</label>
      <input type="range" id="zoomRange" min="0.5" max="3" step="0.1" value="1">
      <div class="btn-grid">
        <button id="toggleCrop" class="active">Mode: Move Image</button>
      </div>
    </div>

    <div class="control-group">
      <h2>3. Tune Lighting</h2>
      <label>Brightness</label>
      <input type="range" id="brightRange" min="50" max="150" value="100">
      <label>Contrast</label>
      <input type="range" id="contrastRange" min="50" max="150" value="100">
      <label>Saturation</label>
      <input type="range" id="satRange" min="0" max="200" value="100">
    </div>

    <div class="control-group">
      <h2>4. Virtual Dress</h2>
      <label>Select Suit to Overlay:</label>
      <div class="asset-list">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgNjAiPjxwYXRoIGQ9Ik01MCw1IEM0MCwxMCAyMCw2MCAxMCw2MCBMOTAsNjAgQzgwLDYwIDYwLDEwIDUwLDUgWiIgZmlsbD0iIzMzMyIvPjxwYXRoIGQ9Ik01MCw1IEw1MCw2MCIgc3Ryb2tlPSIjMjIyIiBzdHJva2Utd2lkdGg9IjEiLz48cGF0aCBkPSJNNTAsNSBMNDAsMjAgTDUwLDMzIEw2MCwyMCBaIiBmaWxsPSJ3aGl0ZSIvPjxwYXRoIGQ9Ik01MCwzMyBMNTAsNjAiIHN0cm9rZT0iI2NjYyIgc3Ryb2tlLXdpZHRoPSIwLjUiLz48L3N2Zz4=" class="asset-item" onclick="addAsset(this.src)">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgNjAiPjxwYXRoIGQ9Ik01MCw1IEMzNSwxNSAxNSw2MCA1LDYwIEw5NSw2MCBDODUsNjAgNjUsMTUgNTAsNSBaIiBmaWxsPSIjMTkyOTNiIi8+PHBhdGggZD0iTTUwLDUgTDQyLDI1IEw1MCw0MCBMNTgsMjUgWiIgZmlsbD0id2hpdGUiLz48cGF0aCBkPSJNNTAsNDAgTDUwLDYwIiBzdHJva2U9IiMzMzMiIHN0cm9rZS13aWR0aD0iMSIvPjwvc3ZnPg==" class="asset-item" onclick="addAsset(this.src)">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgNjAiPjxwYXRoIGQ9Ik01MCw1IEM0MCwxMCAyMCw2MCAxMCw2MCBMOTAsNjAgQzgwLDYwIDYwLDEwIDUwLDUgWiIgZmlsbD0iIzZkMmMzMiIvPjxwYXRoIGQ9Ik01MCw1IEw0MCwyNSBMNTAsMzUgTDYwLDI1IFoiIGZpbGw9IiNmZmYiLz48L3N2Zz4=" class="asset-item" onclick="addAsset(this.src)">
      </div>
      <label style="margin-top:10px;">Or Upload PNG Suit:</label>
      <input type="file" id="assetUpload" accept="image/png">
      <div class="btn-grid">
        <button onclick="clearAssets()">Clear Suit</button>
      </div>
    </div>

    <div class="control-group">
      <h2>5. Background</h2>
      <label>Background Color (Behind Image)</label>
      <input type="color" id="bgColor" value="#ffffff">
      <small style="color:#888;">*Only visible if your photo has transparency</small>
    </div>

    <button class="btn-primary" id="downloadBtn">Download HD Photo</button>
  </div>

  <div class="main-area">
    <div class="canvas-wrapper" id="canvasContainer" style="width: 350px; height: 450px;">
      <canvas id="mainCanvas"></canvas>
      <div id="overlayLayer" style="position:absolute; top:0; left:0; width:100%; height:100%; overflow:hidden;"></div>
    </div>
    <p style="color:#666; margin-top:10px; font-size:0.9rem;">
      <span id="dimsLabel">35 x 45 mm</span> | Scroll to Zoom | Drag to Move
    </p>
  </div>
</div>

<script>
  // --- Configuration ---
  const CONFIG = {
    printDPI: 300,
    previewHeight: 450 // px height on screen
  };

  // --- DOM Elements ---
  const uploadInput = document.getElementById('uploadInput');
  const mainCanvas = document.getElementById('mainCanvas');
  const ctx = mainCanvas.getContext('2d');
  const overlayLayer = document.getElementById('overlayLayer');
  const container = document.getElementById('canvasContainer');
  
  // Controls
  const inputs = {
    zoom: document.getElementById('zoomRange'),
    bright: document.getElementById('brightRange'),
    contrast: document.getElementById('contrastRange'),
    sat: document.getElementById('satRange'),
    bg: document.getElementById('bgColor'),
    size: document.getElementById('sizeSelect'),
    rotateL: document.getElementById('rotateLeftBtn'),
    rotateR: document.getElementById('rotateRightBtn'),
    assetUpload: document.getElementById('assetUpload')
  };

  // --- State ---
  let img = new Image();
  let state = {
    x: 0, y: 0, scale: 1, rotation: 0,
    baseW: 35, baseH: 45, // mm
    aspect: 35/45
  };
  let isDragging = false;
  let lastX, lastY;

  // --- Initialization ---
  function init() {
    updateCanvasSize();
    // Load placeholder logic if needed
    ctx.fillStyle = "#ccc";
    ctx.font = "20px sans-serif";
    ctx.fillText("Upload Image", 50, 50);
  }

  // --- 1. Image Handling ---
  uploadInput.addEventListener('change', e => {
    if(!e.target.files[0]) return;
    const reader = new FileReader();
    reader.onload = evt => {
      img = new Image();
      img.onload = () => {
        // Reset state
        state.rotation = 0;
        state.scale = 1;
        state.x = 0;
        state.y = 0;
        inputs.zoom.value = 1;
        inputs.bright.value = 100;
        
        centerImage();
        render();
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
  });

  function centerImage() {
    // Fit image to canvas
    const ratio = Math.min(mainCanvas.width / img.width, mainCanvas.height / img.height);
    state.scale = ratio;
    // Center
    state.x = (mainCanvas.width - img.width * state.scale) / 2;
    state.y = (mainCanvas.height - img.height * state.scale) / 2;
    inputs.zoom.value = 1; // logical zoom
  }

  // --- 2. Canvas & Rendering ---
  inputs.size.addEventListener('change', updateCanvasSize);

  function updateCanvasSize() {
    const [w, h] = inputs.size.value.split(',').map(Number);
    state.baseW = w;
    state.baseH = h;
    state.aspect = w / h;

    // Set preview size (CSS)
    const previewH = CONFIG.previewHeight;
    const previewW = previewH * state.aspect;
    
    container.style.width = `${previewW}px`;
    container.style.height = `${previewH}px`;
    
    // Set internal resolution (High Res)
    mainCanvas.width = previewW * 2; // Retina/High quality internal buffer
    mainCanvas.height = previewH * 2;

    document.getElementById('dimsLabel').innerText = `${w} x ${h} mm`;
    if(img.src) render();
  }

  function render() {
    if (!img.src) return;

    // Clear
    ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
    
    // Background fill
    ctx.fillStyle = inputs.bg.value;
    ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

    // Filters
    const b = inputs.bright.value;
    const c = inputs.contrast.value;
    const s = inputs.sat.value;
    ctx.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%)`;

    // Transforms
    ctx.save();
    
    // Move to center of canvas
    ctx.translate(mainCanvas.width/2, mainCanvas.height/2);
    ctx.rotate(state.rotation * Math.PI / 180);
    
    // The state.x/y are relative offsets. 
    // We apply zoom here.
    const finalScale = state.scale * inputs.zoom.value * (mainCanvas.width / (state.aspect * 400)); // normalized scale factor

    ctx.translate(-img.width*finalScale/2 + state.x, -img.height*finalScale/2 + state.y);

    ctx.drawImage(img, 0, 0, img.width * finalScale, img.height * finalScale);
    
    ctx.restore();
    ctx.filter = 'none'; // Reset filter for next operations
  }

  // --- 3. Interaction (Pan & Zoom) ---
  overlayLayer.addEventListener('mousedown', e => {
    if(e.target !== overlayLayer) return; // Don't drag background if clicking a suit
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = (e.clientX - lastX) * 2; // *2 for canvas pixel density
    const dy = (e.clientY - lastY) * 2;
    
    // Adjust position based on rotation logic helps, but let's keep it simple: 
    // Moves the Image draw coordinates
    if (state.rotation === 0) { state.x += dx; state.y += dy; }
    else if (state.rotation === 90) { state.x += dy; state.y -= dx; }
    else if (state.rotation === 180) { state.x -= dx; state.y -= dy; }
    else if (state.rotation === 270) { state.x -= dy; state.y += dx; }
    
    lastX = e.clientX;
    lastY = e.clientY;
    render();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    container.style.cursor = 'default';
  });

  // Zoom Wheel
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    let newZoom = parseFloat(inputs.zoom.value) + delta;
    newZoom = Math.min(Math.max(newZoom, 0.5), 3);
    inputs.zoom.value = newZoom;
    render();
  });

  // Slider Listeners
  [inputs.zoom, inputs.bright, inputs.contrast, inputs.sat, inputs.bg].forEach(el => {
    el.addEventListener('input', render);
  });

  // Rotation
  inputs.rotateL.addEventListener('click', () => { state.rotation -= 90; render(); });
  inputs.rotateR.addEventListener('click', () => { state.rotation += 90; render(); });

  // --- 4. Suit/Asset Manager (The Professional Feature) ---
  
  window.addAsset = function(src) {
    const el = document.createElement('img');
    el.src = src;
    el.className = 'overlay-obj';
    el.style.width = '200px';
    // Center in overlay layer
    el.style.left = '50%';
    el.style.top = '80%';
    el.style.transform = 'translate(-50%, -50%)';
    
    // Add drag logic for the asset
    makeInteractable(el);
    overlayLayer.appendChild(el);
  };

  inputs.assetUpload.addEventListener('change', (e) => {
    if(e.target.files[0]) {
      const reader = new FileReader();
      reader.onload = evt => addAsset(evt.target.result);
      reader.readAsDataURL(e.target.files[0]);
    }
  });

  window.clearAssets = function() {
    overlayLayer.innerHTML = '';
  };

  // Basic Drag/Resize for Suits
  function makeInteractable(el) {
    let isDown = false;
    let startX, startY;
    
    el.addEventListener('mousedown', e => {
      isDown = true;
      startX = e.clientX - el.offsetLeft;
      startY = e.clientY - el.offsetTop;
      
      // Select visual
      document.querySelectorAll('.overlay-obj').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      e.stopPropagation(); // Stop background panning
    });

    window.addEventListener('mousemove', e => {
      if (!isDown) return;
      el.style.left = (e.clientX - startX) + 'px';
      el.style.top = (e.clientY - startY) + 'px';
      el.style.transform = 'none'; // remove centering transform once moved
    });

    window.addEventListener('mouseup', () => { isDown = false; });
    
    // Resize on scroll over asset
    el.addEventListener('wheel', e => {
      e.preventDefault();
      e.stopPropagation();
      let w = parseInt(el.style.width || el.clientWidth);
      w += e.deltaY > 0 ? -10 : 10;
      if (w > 20) el.style.width = w + 'px';
    });
  }

  // --- 5. Final Download ---
  document.getElementById('downloadBtn').addEventListener('click', () => {
    // 1. Create a temp high-res canvas
    const dlCanvas = document.createElement('canvas');
    // MM to Pixels (300 DPI)
    const targetW = Math.round(state.baseW * 11.81);
    const targetH = Math.round(state.baseH * 11.81);
    
    dlCanvas.width = targetW;
    dlCanvas.height = targetH;
    const dlCtx = dlCanvas.getContext('2d');

    // 2. Draw Background & Image (Scaled)
    // We basically need to replay the render() logic but scaled to the final size
    const scaleFactor = targetW / mainCanvas.width;
    
    dlCtx.fillStyle = inputs.bg.value;
    dlCtx.fillRect(0, 0, targetW, targetH);
    dlCtx.filter = ctx.filter; // Inherit filters
    
    dlCtx.save();
    dlCtx.translate(targetW/2, targetH/2);
    dlCtx.rotate(state.rotation * Math.PI / 180);
    
    const finalScale = state.scale * inputs.zoom.value * (mainCanvas.width / (state.aspect * 400));
    // Apply final output scaling
    const outScale = finalScale * scaleFactor;
    
    // Recalculate offsets for High Res
    // Note: state.x is based on preview canvas pixels. We must scale it.
    dlCtx.translate(
        (-img.width*outScale/2) + (state.x * scaleFactor), 
        (-img.height*outScale/2) + (state.y * scaleFactor)
    );
    
    dlCtx.drawImage(img, 0, 0, img.width * outScale, img.height * outScale);
    dlCtx.restore();
    dlCtx.filter = 'none';

    // 3. Draw Overlays (Suits)
    const assets = document.querySelectorAll('.overlay-obj');
    assets.forEach(asset => {
      // Get position relative to the OverlayLayer (which is same size as mainCanvas)
      // and scale it up to dlCanvas size
      const rect = asset.getBoundingClientRect();
      const parentRect = overlayLayer.getBoundingClientRect();
      
      const relativeX = rect.left - parentRect.left;
      const relativeY = rect.top - parentRect.top;
      
      dlCtx.drawImage(
        asset, 
        relativeX * scaleFactor, 
        relativeY * scaleFactor, 
        rect.width * scaleFactor, 
        rect.height * scaleFactor
      );
    });

    // 4. Save
    const link = document.createElement('a');
    link.download = `ID_Photo_Pro_${state.baseW}x${state.baseH}.jpg`;
    link.href = dlCanvas.toDataURL('image/jpeg', 0.95);
    link.click();
  });

  // Start
  init();

</script>
</body>
</html>
