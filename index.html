<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar AI Pro | Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --sidebar-bg: #171717; --main-bg: #212121; --input-bg: #2f2f2f; --accent: #19c37d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--main-bg); color: #ececec; margin: 0; display: flex; height: 100vh; }

        /* Sidebar - Fixed Click Logic */
        .sidebar { width: 0; background: var(--sidebar-bg); transition: 0.3s ease; overflow: hidden; display: flex; flex-direction: column; z-index: 1000; height: 100%; border-right: 0px solid #3d3d3d; }
        .sidebar.active { width: 260px; border-right: 1px solid #3d3d3d; padding: 15px; }
        .sidebar-item { padding: 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; font-size: 14px; white-space: nowrap; }
        .sidebar-item:hover { background: #2d2d2d; }
        .new-chat { border: 1px solid #4d4d4d; margin-bottom: 20px; font-weight: bold; justify-content: center; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; width: 100%; }
        
        /* Header */
        .header { padding: 15px 20px; display: flex; align-items: center; gap: 15px; background: var(--main-bg); border-bottom: 1px solid #3d3d3d; }
        .menu-btn { font-size: 22px; cursor: pointer; color: #b4b4b4; padding: 5px; }
        .profile { display: flex; align-items: center; gap: 10px; }
        .user-photo { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--accent); }

        /* Chat Area */
        #chat-area { flex: 1; overflow-y: auto; padding: 30px 10%; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 85%; line-height: 1.6; font-size: 16px; word-wrap: break-word; }
        .user-msg { text-align: right; background: var(--input-bg); padding: 10px 18px; border-radius: 18px; align-self: flex-end; color: #fff; }
        .ai-msg { border-left: 3px solid var(--accent); padding: 5px 15px; align-self: flex-start; color: #d1d1d1; }

        /* Bottom Input */
        .bottom-container { padding: 20px 10%; background: var(--main-bg); }
        .input-bar { background: var(--input-bg); border-radius: 28px; display: flex; align-items: center; padding: 8px 18px; border: 1px solid #4d4d4d; }
        .plus-btn, .mic-btn { color: #b4b4b4; font-size: 20px; cursor: pointer; border: none; background: none; transition: 0.2s; }
        .plus-btn:hover, .mic-btn:hover { color: #fff; }
        textarea { flex: 1; background: none; border: none; color: white; outline: none; font-size: 16px; resize: none; max-height: 150px; padding: 10px; font-family: inherit; }
        .send-btn { background: #fff; color: #000; width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-left: 10px; }
        
        img.gen-img { width: 100%; max-width: 450px; border-radius: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-item new-chat" onclick="location.reload()"><i class="fas fa-plus"></i> New Chat</div>
    <div class="sidebar-item"><i class="fas fa-history"></i> History</div>
    <div class="sidebar-item" onclick="alert('Settings Open')"><i class="fas fa-cog"></i> Settings</div>
    <div class="sidebar-item" onclick="savePDF()"><i class="fas fa-file-pdf"></i> Download PDF</div>
    <div style="margin-top: auto; padding: 10px;">
        <div class="sidebar-item" style="color: var(--accent);"><i class="fas fa-star"></i> Azhar Pro Version</div>
    </div>
</div>

<div class="main-content">
    <div class="header">
        <i class="fas fa-bars menu-btn" id="menu-toggle" onclick="toggleSidebar()"></i>
        <div class="profile">
            <img src="profile.jpg" class="user-photo" alt="Azhar" onerror="this.src='https://via.placeholder.com/32'">
            <span style="font-weight: bold;">Azhar AI Pro</span>
        </div>
    </div>

    <div id="chat-area">
        <div class="message ai-msg">Hello Azhar! Main aapki madad ke liye hazir hoon. Aap koi bhi zubaan istemal kar sakte hain.</div>
    </div>

    <div class="bottom-container">
        <div class="input-bar">
            <button class="plus-btn" onclick="createImage()" title="Generate Image"><i class="fas fa-plus-circle"></i></button>
            <textarea id="userInput" rows="1" placeholder="Ask anything..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
            <button class="mic-btn" onclick="startMic()"><i class="fas fa-microphone"></i></button>
            <button class="send-btn" onclick="askAI()"><i class="fas fa-arrow-up"></i></button>
        </div>
    </div>
</div>

<script>
    // 1. Sidebar Toggle Fix
    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        sb.classList.toggle('active');
    }

    // 2. Multilingual AI Chat
    async function askAI() {
        const inputField = document.getElementById('userInput');
        const text = inputField.value.trim();
        if(!text) return;

        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML += `<div class="message user-msg">${text}</div>`;
        inputField.value = '';
        inputField.style.height = 'auto';
        
        const resDiv = document.createElement('div');
        resDiv.className = 'message ai-msg';
        resDiv.innerText = '...';
        chatArea.appendChild(resDiv);
        chatArea.scrollTop = chatArea.scrollHeight;

        try {
            // Updated System Prompt: Respond in user's language naturally
            const system = "Respond naturally in the same language the user uses. If they speak Urdu, reply in Urdu. If English, reply in English. Be human-like, no robot symbols.";
            const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?system=${encodeURIComponent(system)}`);
            const data = await res.text();
            resDiv.innerText = data.replace(/[\\*_#-]/g, '').trim();
        } catch (e) { resDiv.innerText = "Error Connecting."; }
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // 3. Image Creation
    function createImage() {
        const text = document.getElementById('userInput').value;
        if(!text) return alert("Pehle niche box mein prompt likhein!");
        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML += `<div class="message user-msg">Generating: ${text}</div>`;
        chatArea.innerHTML += `<div class="message ai-msg"><img src="https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?nologo=true" class="gen-img"></div>`;
        document.getElementById('userInput').value = '';
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // 4. Voice Mic Fix
    function startMic() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.onresult = (e) => { 
            document.getElementById('userInput').value = e.results[0][0].transcript;
            askAI();
        };
        rec.start();
    }

    // 5. PDF Download
    function savePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text(document.getElementById('chat-area').innerText, 10, 10, {maxWidth: 180});
        doc.save("Azhar-AI-Chat.pdf");
    }
</script>
</body>
</html>
