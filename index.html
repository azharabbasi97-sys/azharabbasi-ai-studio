<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar Abbasi AI Studio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        .profile-section { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-align: left; }
        .user-photo { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #4A90E2; object-fit: cover; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; resize: none; }
        .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .btn-ask { background: #6c5ce7; }
        .btn-img { background: #ff7675; }
        #output { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; text-align: left; min-height: 50px; border-left: 5px solid #6c5ce7; }
        img.generated-img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-section">
        <img src="profile.jpg" class="user-photo" alt="Azhar Abbasi" onerror="this.src='https://via.placeholder.com/80'">
        <div>
            <h2 style="margin:0;">Azhar Abbasi</h2>
            <p style="margin:0; color:gray;">AI Studio Developer</p>
        </div>
    </div>

    <textarea id="user-input" placeholder="Kuch bhi likhein (e.g. Generate a cat photo ya Sawal poochein)..."></textarea>
    
    <div class="buttons">
        <button class="btn-ask" onclick="askAI()">Ask AI</button>
        <button class="btn-img" onclick="generateImage()">Create Image</button>
    </div>

    <div id="output">Jawab yahan dikhega...</div>
</div>

<script>
    const GEMINI_API_KEY = "AIzaSyDgZmviVIFbOZ7RbTMF9m7Io1dKPblUzvg";

    async function askAI() {
        const input = document.getElementById('user-input').value;
        const output = document.getElementById('output');
        if (!input) return alert("Kuch likhein!");

        output.innerHTML = "AI Soch raha hai...";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: input }] }] })
            });
            const data = await response.json();
            output.innerText = data.candidates[0].content.parts[0].text;
        } catch (e) {
            output.innerText = "Error: API Key ya Connection ka masla hai.";
        }
    }

    function generateImage() {
        const input = document.getElementById('user-input').value;
        const output = document.getElementById('output');
        if (!input) return alert("Image ka prompt likhein!");

        output.innerHTML = "Image ban rahi hai...";
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(input)}?width=800&height=500&nologo=true`;
        output.innerHTML = `<img src="${imgUrl}" class="generated-img" alt="AI Generated">`;
    }
</script>

</body>
</html>
