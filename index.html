<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar AI | Pro Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --sidebar-bg: #171717; --main-bg: #212121; --input-bg: #2f2f2f; --accent: #19c37d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--main-bg); color: #ececec; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Style */
        .sidebar { width: 0; background: var(--sidebar-bg); transition: 0.3s; overflow: hidden; display: flex; flex-direction: column; position: relative; z-index: 1000; }
        .sidebar.active { width: 260px; padding: 15px; border-right: 1px solid #3d3d3d; }
        .sidebar-item { padding: 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; font-size: 14px; }
        .sidebar-item:hover { background: #2d2d2d; }
        .new-chat { border: 1px solid #4d4d4d; margin-bottom: 20px; font-weight: bold; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* Top Header */
        .header { padding: 15px 20px; display: flex; align-items: center; gap: 15px; background: var(--main-bg); border-bottom: 1px solid #3d3d3d; }
        .menu-btn { font-size: 22px; cursor: pointer; color: #b4b4b4; }
        .profile { display: flex; align-items: center; gap: 10px; }
        .user-photo { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent); }

        /* Chat Area */
        #chat-area { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 25px; }
        .message { max-width: 100%; line-height: 1.8; font-size: 16px; white-space: pre-wrap; }
        .user-msg { font-weight: 600; text-align: right; background: var(--input-bg); padding: 12px 18px; border-radius: 15px; align-self: flex-end; }
        .ai-msg { border-left: 3px solid var(--accent); padding-left: 15px; align-self: flex-start; }

        /* Input Bar Area */
        .bottom-container { padding: 20px 15%; background: var(--main-bg); }
        .input-bar { background: var(--input-bg); border-radius: 30px; display: flex; align-items: center; padding: 10px 20px; border: 1px solid #4d4d4d; }
        .plus-btn { color: #b4b4b4; font-size: 20px; cursor: pointer; margin-right: 15px; border: none; background: none; }
        textarea { flex: 1; background: none; border: none; color: white; outline: none; font-size: 16px; resize: none; max-height: 150px; font-family: inherit; }
        .right-icons { display: flex; align-items: center; gap: 15px; }
        .mic-btn { color: #b4b4b4; font-size: 18px; cursor: pointer; border: none; background: none; }
        .send-btn { background: #fff; color: #000; width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        img.gen-img { width: 100%; max-width: 500px; border-radius: 12px; margin-top: 10px; border: 1px solid #4d4d4d; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-item new-chat" onclick="location.reload()"><i class="fas fa-plus"></i> New Chat</div>
    <div class="sidebar-item"><i class="fas fa-history"></i> Chat History</div>
    <div class="sidebar-item"><i class="fas fa-magic"></i> My GPTs</div>
    <div class="sidebar-item" onclick="alert('Settings Khul Gayi!')"><i class="fas fa-cog"></i> Settings</div>
    <div style="margin-top: auto;">
        <div class="sidebar-item" onclick="savePDF()"><i class="fas fa-file-pdf"></i> Save PDF</div>
        <div class="sidebar-item" style="color: var(--accent);"><i class="fas fa-star"></i> Upgrade to Plus</div>
    </div>
</div>

<div class="main-content">
    <div class="header">
        <i class="fas fa-bars menu-btn" onclick="toggleSidebar()"></i>
        <div class="profile">
            <img src="profile.jpg" class="user-photo" alt="Azhar" onerror="this.src='https://via.placeholder.com/32'">
            <span style="font-weight: bold; font-size: 14px;">Azhar AI Pro <i class="fas fa-chevron-down" style="font-size: 10px; color: #8e8e8e;"></i></span>
        </div>
    </div>

    <div id="chat-area">
        <div class="message ai-msg">Assalam-o-Alaikum Azhar! Main aapki kaise madad kar sakta hoon?</div>
    </div>

    <div class="bottom-container">
        <div class="input-bar">
            <button class="plus-btn" onclick="createImage()"><i class="fas fa-plus-circle"></i></button>
            <textarea id="userInput" rows="1" placeholder="Message Azhar AI..." oninput="autoHeight(this)"></textarea>
            <div class="right-icons">
                <button class="mic-btn" onclick="startMic()"><i class="fas fa-microphone"></i></button>
                <button class="send-btn" onclick="askAI()"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
        <p style="text-align: center; font-size: 11px; color: #8e8e8e; margin-top: 10px;">Azhar AI can provide info. Verify important details.</p>
    </div>
</div>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
    }

    function autoHeight(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    async function askAI() {
        const text = document.getElementById('userInput').value.trim();
        if(!text) return;

        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML += `<div class="message user-msg">${text}</div>`;
        document.getElementById('userInput').value = '';
        
        const resDiv = document.createElement('div');
        resDiv.className = 'message ai-msg';
        resDiv.innerText = 'Searching...';
        chatArea.appendChild(resDiv);
        chatArea.scrollTop = chatArea.scrollHeight;

        try {
            const system = "Reply only in Urdu. Professional and Human-like. No robot symbols.";
            const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?system=${encodeURIComponent(system)}`);
            const data = await res.text();
            resDiv.innerText = data.replace(/[\\*_#-]/g, '').trim();
        } catch (e) { resDiv.innerText = "Error Connecting."; }
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function createImage() {
        const text = document.getElementById('userInput').value;
        if(!text) return alert("Pehle description likhen!");
        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML += `<div class="message ai-msg"><img src="https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?nologo=true" class="gen-img"></div>`;
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function startMic() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'ur-PK';
        rec.onresult = (e) => { 
            document.getElementById('userInput').value = e.results[0][0].transcript;
            askAI();
        };
        rec.start();
    }

    function savePDF() {
        const doc = new jspdf.jsPDF();
        doc.text(document.getElementById('chat-area').innerText, 10, 10, {maxWidth: 180});
        doc.save("Azhar-AI-Chat.pdf");
    }
</script>
</body>
</html>
